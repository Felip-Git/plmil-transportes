<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Empresa</title>
</head>

<body>

    <h1>Editar Empresa</h1>

    <form method="POST">

        <label for="nome">
            Nome da empresa:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ empresa[1] }}"
            required
        >

        <br><br>

        <button type="submit">
            Salvar alterações
        </button>

        <a href="{{ url_for('empresas') }}">
            Cancelar
        </a>

    </form>

</body>

</html>
