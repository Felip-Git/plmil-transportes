<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos - PL Mil Transportes</title>
</head>

<body>

    <h1>Pedidos</h1>

    <a href="{{ url_for('cadastrar_pedido') }}">
        <button type="button">
            Cadastrar pedido
        </button>
    </a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Empresa</th>
                <th>Data de criação</th>
            </tr>
        </thead>

        <tbody>
            {% for pedido in pedidos %}
            <tr>
                <td>{{ pedido[0] }}</td>
                <td>{{ pedido[1] }}</td>
                <td>{{ pedido[2] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
