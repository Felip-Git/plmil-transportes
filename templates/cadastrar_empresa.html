<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Empresa</title>
</head>

<body>

    <h1>Cadastrar Empresa</h1>

    <form method="POST">

        <label for="nome">Nome da empresa:</label>

        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>
</html>
