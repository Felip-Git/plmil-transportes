<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Motorista</title>
</head>

<body>

    <h1>Cadastrar Motorista</h1>

    <form method="POST">

        <label for="nome">
            Nome do motorista:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            required
        >

        <br><br>

        <label for="valor_km">
            Valor por KM:
        </label>

        <input
            type="number"
            id="valor_km"
            name="valor_km"
            step="0.01"
            min="0"
            placeholder="Ex.: 2,50"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>
</html>
