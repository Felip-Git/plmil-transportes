<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Cadastrar Serviço</title>

    <style>

        .funcionarios-container {
            width: 400px;
            margin-top: 10px;
        }

        #busca-funcionario {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }

        #lista-funcionarios {
            border: 1px solid #ccc;
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
        }

        .funcionario-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .funcionario-item:last-child {
            border-bottom: none;
        }

        .funcionario-item button {
            margin-left: 10px;
        }

        #funcionarios-selecionados {
            margin-top: 15px;
        }

        .funcionario-selecionado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #f2f2f2;
            border-radius: 4px;
        }

        .mensagem {
            margin-top: 10px;
        }

    </style>

</head>

<body>

    <h1>Cadastrar Serviço</h1>


    <form method="POST" id="form-servico">

        <label for="empresa_id">
            Empresa:
        </label>

        <select
            id="empresa_id"
            name="empresa_id"
            required
        >

            <option value="">
                Selecione uma empresa
            </option>

            {% for empresa in empresas %}

            <option value="{{ empresa[0] }}">
                {{ empresa[1] }}
            </option>

            {% endfor %}

        </select>


        <br><br>


        <label for="motorista_id">
            Motorista:
        </label>

        <select
            id="motorista_id"
            name="motorista_id"
            required
        >

            <option value="">
                Selecione um motorista
            </option>

            {% for motorista in motoristas %}

            <option value="{{ motorista[0] }}">
                {{ motorista[1] }}
            </option>

            {% endfor %}

        </select>


        <br><br>


        <label for="data">
            Data do serviço:
        </label>

        <input
            type="date"
            id="data"
            name="data"
            required
        >


        <br><br>


        <label for="km">
            KM:
        </label>

        <input
    type="text"
    id="km"
    name="km"
    required
>


        <br><br>


        <fieldset>

            <legend>
                Funcionários transportados
            </legend>


            <p>
                Selecione uma empresa para carregar os funcionários.
            </p>


            <div class="funcionarios-container">

                <input
                    type="text"
                    id="busca-funcionario"
                    placeholder="Pesquisar funcionário..."
                    disabled
                >


                <div id="lista-funcionarios">

                    <p>
                        Nenhuma empresa selecionada.
                    </p>

                </div>


                <div id="funcionarios-selecionados">

                    <strong>
                        Funcionários selecionados:
                    </strong>

                    <p id="nenhum-selecionado">
                        Nenhum funcionário selecionado.
                    </p>

                </div>

            </div>

        </fieldset>


        <br>


        <button type="submit">
            Cadastrar serviço
        </button>

    </form>


    <script>

        const empresaSelect =
            document.getElementById("empresa_id");

        const buscaFuncionario =
            document.getElementById("busca-funcionario");

        const listaFuncionarios =
            document.getElementById("lista-funcionarios");

        const funcionariosSelecionados =
            document.getElementById("funcionarios-selecionados");

        const nenhumSelecionado =
            document.getElementById("nenhum-selecionado");

        const formServico =
            document.getElementById("form-servico");


        let funcionarios = [];

        let selecionados = new Map();


        empresaSelect.addEventListener(
            "change",
            carregarFuncionarios
        );


        async function carregarFuncionarios() {

            const empresaId = empresaSelect.value;


            funcionarios = [];

            selecionados.clear();

            atualizarSelecionados();


            if (!empresaId) {

                buscaFuncionario.disabled = true;

                buscaFuncionario.value = "";

                listaFuncionarios.innerHTML = `
                    <p>
                        Nenhuma empresa selecionada.
                    </p>
                `;

                return;
            }


            buscaFuncionario.disabled = false;

            buscaFuncionario.value = "";


            listaFuncionarios.innerHTML = `
                <p>
                    Carregando funcionários...
                </p>
            `;


            try {

                const resposta = await fetch(
                    `/funcionarios/empresa/${empresaId}`
                );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao buscar funcionários."
                    );

                }


                funcionarios = await resposta.json();


                renderizarFuncionarios();

            } catch (erro) {

                console.error(erro);

                listaFuncionarios.innerHTML = `
                    <p>
                        Não foi possível carregar os funcionários.
                    </p>
                `;

            }

        }


        buscaFuncionario.addEventListener(
            "input",
            renderizarFuncionarios
        );


        function renderizarFuncionarios() {

            const busca =
                buscaFuncionario.value
                    .toLowerCase()
                    .trim();


            const funcionariosFiltrados =
                funcionarios.filter(
                    funcionario =>
                        funcionario.nome
                            .toLowerCase()
                            .includes(busca)
                );


            listaFuncionarios.innerHTML = "";


            if (funcionariosFiltrados.length === 0) {

                listaFuncionarios.innerHTML = `
                    <p>
                        Nenhum funcionário encontrado.
                    </p>
                `;

                return;
            }


            funcionariosFiltrados.forEach(
                funcionario => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "funcionario-item";


                    const nome =
                        document.createElement("span");

                    nome.textContent =
                        funcionario.nome;


                    const botao =
                        document.createElement("button");

                    botao.type = "button";

                    botao.textContent =
                        selecionados.has(
                            funcionario.id
                        )
                            ? "Adicionado"
                            : "Adicionar";


                    botao.disabled =
                        selecionados.has(
                            funcionario.id
                        );


                    botao.addEventListener(
                        "click",
                        function () {

                            adicionarFuncionario(
                                funcionario
                            );

                        }
                    );


                    item.appendChild(nome);

                    item.appendChild(botao);

                    listaFuncionarios.appendChild(item);

                }
            );

        }


        function adicionarFuncionario(funcionario) {

            selecionados.set(
                funcionario.id,
                funcionario
            );


            atualizarSelecionados();

            renderizarFuncionarios();

        }


        function removerFuncionario(funcionarioId) {

            selecionados.delete(
                funcionarioId
            );


            atualizarSelecionados();

            renderizarFuncionarios();

        }


        function atualizarSelecionados() {

            const itensAntigos =
                document.querySelectorAll(
                    ".funcionario-hidden"
                );


            itensAntigos.forEach(
                item => item.remove()
            );


            const itensSelecionados =
                funcionariosSelecionados.querySelectorAll(
                    ".funcionario-selecionado"
                );


            itensSelecionados.forEach(
                item => item.remove()
            );


            if (selecionados.size === 0) {

                nenhumSelecionado.style.display =
                    "block";

                return;

            }


            nenhumSelecionado.style.display =
                "none";


            selecionados.forEach(
                funcionario => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "funcionario-selecionado";


                    const nome =
                        document.createElement("span");

                    nome.textContent =
                        funcionario.nome;


                    const botao =
                        document.createElement("button");

                    botao.type = "button";

                    botao.textContent =
                        "Remover";


                    botao.addEventListener(
                        "click",
                        function () {

                            removerFuncionario(
                                funcionario.id
                            );

                        }
                    );


                    item.appendChild(nome);

                    item.appendChild(botao);


                    funcionariosSelecionados.appendChild(
                        item
                    );


                    const hidden =
                        document.createElement("input");

                    hidden.type =
                        "hidden";

                    hidden.name =
                        "funcionarios_ids";

                    hidden.value =
                        funcionario.id;

                    hidden.className =
                        "funcionario-hidden";


                    formServico.appendChild(
                        hidden
                    );

                }
            );

        }


        formServico.addEventListener(
            "submit",
            function (evento) {

                if (selecionados.size === 0) {

                    evento.preventDefault();

                    alert(
                        "Selecione pelo menos um funcionário."
                    );

                }

            }
        );

    </script>

</body>

</html>
