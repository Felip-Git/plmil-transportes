<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Motorista</title>
</head>

<body>

    <h1>Editar Motorista</h1>

    <form method="POST">

        <label for="nome">
            Nome do motorista:
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ motorista[1] }}"
            required
        >

        <br><br>

        <label for="valor_km">
            Valor por KM:
        </label>

        <input
            type="number"
            id="valor_km"
            name="valor_km"
            value="{{ motorista[2] }}"
            step="0.01"
            min="0"
            required
        >

        <br><br>

        <button type="submit">
            Salvar alterações
        </button>

        <a href="{{ url_for('motoristas') }}">
            Cancelar
        </a>

    </form>

</body>

</html>
