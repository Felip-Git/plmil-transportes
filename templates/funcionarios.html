<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Funcionários</title>
</head>

<body>

    <h1>Funcionários</h1>

    <a href="{{ url_for('cadastrar_funcionario') }}">
        Cadastrar novo funcionário
    </a>

    <br><br>

    {% if funcionarios %}

    <table border="1" cellpadding="8">

        <thead>

            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Empresa</th>
                <th>Ações</th>
            </tr>

        </thead>

        <tbody>

            {% for funcionario in funcionarios %}

            <tr>

                <td>
                    {{ funcionario[0] }}
                </td>

                <td>
                    {{ funcionario[1] }}
                </td>

                <td>
                    {{ funcionario[2] }}
                </td>

                <td>

                    <a href="{{ url_for(
                        'editar_funcionario',
                        funcionario_id=funcionario[0]
                    ) }}">
                        Editar
                    </a>

                    <form
                        method="POST"
                        action="{{ url_for(
                            'excluir_funcionario_rota',
                            funcionario_id=funcionario[0]
                        ) }}"
                        style="display: inline;"
                        onsubmit="return confirm(
                            'Tem certeza que deseja excluir este funcionário?'
                        );"
                    >

                        <button type="submit">
                            Excluir
                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <p>
        Nenhum funcionário cadastrado.
    </p>

    {% endif %}

</body>

</html>
