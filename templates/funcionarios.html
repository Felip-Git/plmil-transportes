<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Funcionários - PL Mil Transportes</title>
</head>

<body>

    <h1>Funcionários</h1>

    <a href="{{ url_for('cadastrar_funcionario') }}">
        <button type="button">
            Cadastrar funcionário
        </button>
    </a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
            </tr>
        </thead>

        <tbody>
            {% for funcionario in funcionarios %}
            <tr>
                <td>{{ funcionario[0] }}</td>
                <td>{{ funcionario[1] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
